context:
  version: "3.2.0"

package:
  name: python-couchdb3
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/c/couchdb3/couchdb3-${{ version }}.tar.gz
    sha256: 9c42143a700b2f4334af0f1b9f24325afaef094edf4595b07ab8f99b7b815a14
    patches:
      # Upstream lists build and pdoc3 in [project].dependencies, but neither
      # is imported by the package and both are already in the dev extra.
      # Without this, pip_check demands them at runtime. Not yet filed upstream.
      - patches/0001-Drop-build-and-pdoc3-from-runtime-dependencies.patch

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.10.9,<0.11.0
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.27,<1.0

tests:
  - python:
      imports:
        - couchdb3
        - couchdb3.aio
        - couchdb3.sync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A wrapper around the CouchDB API
  homepage: https://n-vlahovic.github.io/couchdb3/
  license: MIT
  license_file: LICENSE
  repository: https://github.com/N-Vlahovic/couchdb3
  documentation: https://n-vlahovic.github.io/couchdb3/

extra:
  recipe-maintainers:
    - chrisburr
