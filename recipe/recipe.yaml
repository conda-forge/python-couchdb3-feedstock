context:
  version: "3.4.4"

package:
  name: python-couchdb3
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/c/couchdb3/couchdb3-${{ version }}.tar.gz
    sha256: 254b98a4fdad595db3c2077d6ee389c434d235c5d5b37945b903726ac9c93e48

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.10.9,<0.11.0
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.27,<1.0

tests:
  - python:
      imports:
        - couchdb3
        - couchdb3.aio
        - couchdb3.sync
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A wrapper around the CouchDB API
  homepage: https://n-vlahovic.github.io/couchdb3/
  license: MIT
  license_file: LICENSE
  repository: https://github.com/N-Vlahovic/couchdb3
  documentation: https://n-vlahovic.github.io/couchdb3/

extra:
  recipe-maintainers:
    - chrisburr
